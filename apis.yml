aid: obligate
name: Obligate
description: >-
  Obligate (formerly FQX) is a Swiss digital-securities infrastructure provider
  for regulated on-chain debt capital markets. Its AssetOS platform lets
  companies issue tokenized bonds and short-term notes as blockchain-based
  eNotes and eTrackers under the Swiss DLT Act and Code of Obligations, while
  institutional investors access regulated on-chain private credit,
  asset-backed securities and trade-finance yield products. Obligate automates
  the bond lifecycle with smart contracts across multiple blockchains, with
  built-in KYB/KYC, settlement and enforcement, reducing issuance cost and time
  versus traditional debt issuance.
